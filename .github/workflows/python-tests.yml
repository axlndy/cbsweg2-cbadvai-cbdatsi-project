name: Automated Python Analytics Tests

on:
  push:
    branches:
      - main
      - development
      - "feature/**"

  pull_request:
    branches:
      - main
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v3

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install System Dependencies for Data Visualization
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-6 libxext6 libxrender-dev libxi6

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Test Suite using Pytest
      run: |
        python -m pytest
