name: Automated Python Analytics Tests & Release

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies for Data Visualization
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-6 libxext6 libxrender-dev libxi6

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Test Suite and Check Coverage
      env:
        PYTHONPATH: .
        MPLBACKEND: Agg
      run: |
        python -m pytest -v --cov=src --cov-report=term-missing

    - name: Release Artifacts
      run: |
        zip -r release-${{ env.VERSION }}.zip \
          src/ \
          tests/ \
          requirements.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-${{ env.VERSION }}.zip
        tag_name: ${{ env.VERSION }}
        overwrite: true
