name: Automated Python Analytics Tests

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'  # <--- OPTIMIZATION: Caches pip dependencies across builds

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest  # <--- OPTIMIZATION: Guarantees pytest is installed
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Test Suite using Pytest
      env:
        PYTHONPATH: .
        MPLBACKEND: Agg
      run: |
        python -m pytest -v
